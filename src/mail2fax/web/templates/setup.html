{% extends "base.html" %}
{% block title %}Einrichtung – mail2fax{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <h1>Erste Einrichtung</h1>
    <p class="hint">
      Vergeben Sie ein Passwort für die Weboberfläche. Es wird als PBKDF2-Hash
      gespeichert, nicht im Klartext.
    </p>
    <form method="post" action="/einrichtung">
      <label for="password">Neues Passwort</label>
      <input type="password" id="password" name="password" required autofocus autocomplete="new-password">
      <label for="password2">Passwort wiederholen</label>
      <input type="password" id="password2" name="password2" required autocomplete="new-password">
      <p class="hint">Mindestens 12 Zeichen aus drei der vier Zeichenarten.</p>
      <div class="actions"><button type="submit">Passwort setzen</button></div>
    </form>
  </div>
</div>
{% endblock %}
